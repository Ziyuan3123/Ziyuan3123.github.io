<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PPT 设计作品集 · 王子源</title>
<meta name="description" content="王子源的 PPT 设计作品：企业介绍、商业路演、课程课件、英文汇报。">
<meta property="og:title" content="PPT 设计作品集 · 王子源">
<meta property="og:description" content="企业介绍 · 商业路演 · 课程课件 · 英文汇报">
<meta property="og:image" content="https://wangziyuan.cn/ppt/og.jpg?v=2">
<meta property="og:url" content="https://wangziyuan.cn/ppt/">
<meta name="theme-color" content="#f6f7f9">
<style>
:root{--bg:#f6f7f9;--ink:#15181d;--muted:#6b7280;--line:#e3e6eb;--card:#fff;--accent:#0a9ae6}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;line-height:1.6}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{padding:64px 0 36px}
.eyebrow{font-size:13px;letter-spacing:.2em;color:var(--accent);font-weight:600}
h1{font-size:clamp(32px,6vw,56px);line-height:1.15;margin:10px 0 14px;letter-spacing:.02em}
.lead{color:var(--muted);font-size:clamp(15px,2vw,18px);max-width:640px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{font-size:13px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:#fff}
.work{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:28px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;margin-bottom:16px}
.num{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
h2{font-size:clamp(20px,3vw,26px);line-height:1.3}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.meta{font-size:13px;color:var(--muted);white-space:nowrap}
.cover{display:block;width:100%;border:0;padding:0;background:#ddd;border-radius:12px;overflow:hidden;cursor:zoom-in;position:relative;aspect-ratio:16/9}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.cover:hover img{transform:scale(1.015)}
.cover .hint{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;padding:6px 12px;border-radius:999px;backdrop-filter:blur(6px)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:14px 2px 4px;scroll-snap-type:x proximity;scrollbar-width:thin}
.strip button{flex:0 0 auto;width:168px;aspect-ratio:16/9;border:0;padding:0;border-radius:8px;overflow:hidden;cursor:zoom-in;background:#e5e7eb;scroll-snap-align:start;outline-offset:2px}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
footer{padding:20px 0 60px;color:var(--muted);font-size:14px;text-align:center}
footer .mail{display:inline-block;margin:8px 0 14px;font-size:17px;color:var(--ink);font-weight:600;text-decoration:none;border-bottom:2px solid var(--accent)}
footer .home{font-size:13px}
/* viewer */
.viewer{position:fixed;inset:0;background:#0b0d11;display:none;z-index:50;flex-direction:column;touch-action:pan-y}
.viewer.on{display:flex}
.vtop{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:#e5e7eb;font-size:14px;gap:12px}
.vtop b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbtn{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;width:42px;height:42px;font-size:20px;cursor:pointer;flex:0 0 auto}
.vbtn:hover{background:rgba(255,255,255,.22)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;padding:0 64px}
.stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5);user-select:none;-webkit-user-drag:none}
.prev,.next{position:absolute;top:50%;transform:translateY(-50%)}
.prev{left:12px}.next{right:12px}
.vbot{text-align:center;color:#9ca3af;font-size:13px;padding:10px 0 calc(14px + env(safe-area-inset-bottom))}
@media (max-width:640px){
  header{padding:40px 0 24px}
  .work{padding:14px;border-radius:14px}
  .strip button{width:132px}
  .stage{padding:0 8px}
  .prev,.next{top:auto;bottom:-56px;transform:none}
  .prev{left:calc(50% - 60px)}.next{right:calc(50% - 60px)}
  .vbot{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">PPT DESIGN PORTFOLIO</div>
    <h1>PPT 设计作品集</h1>
    <p class="lead">王子源 · 企业介绍、商业路演、课程课件、英文汇报。点任意一页可以全屏翻看。</p>
    <div class="chips"><span class="chip">企业宣讲</span><span class="chip">融资 / 商业路演</span><span class="chip">课程课件</span><span class="chip">英文汇报</span></div>
  </header>
  <main id="works"></main>
  <footer>
    <div>需要做 PPT，欢迎联系</div>
    <a class="mail" href="mailto:ryan12332190@gmail.com">ryan12332190@gmail.com</a>
    <div class="home"><a href="/">← 个人主页</a></div>
  </footer>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="作品全屏浏览">
  <div class="vtop"><b id="vtitle"></b><button class="vbtn" id="vclose" aria-label="关闭">✕</button></div>
  <div class="stage" id="stage">
    <button class="vbtn prev" id="vprev" aria-label="上一页">‹</button>
    <img id="vimg" alt="">
    <button class="vbtn next" id="vnext" aria-label="下一页">›</button>
  </div>
  <div class="vbot" id="vcount"></div>
</div>

<script>
const WORKS=[
  {id:'chuangping',n:23,title:'数据要素与可信数据空间 · 企业介绍',sub:'企业宣讲 PPT · 蓝白玻璃质感（客户信息已打码）',cover:1},
  {id:'ev',n:14,title:'驭电出海 · 新能源汽车全球化路演',sub:'商业路演 PPT · 深色电影感',cover:1},
  {id:'jiangshan',n:12,title:'千里江山图 · 艺术品鉴赏课',sub:'课程课件 · 国风青绿',cover:2},
  {id:'coffee',n:18,title:'Mellower Coffee 供应链案例分析',sub:'英文汇报 PPT · 手绘插画风',cover:1}
];
const pad=i=>String(i).padStart(2,'0');
const src=(w,i,s)=>`img/${w.id}-${pad(i)}${s?'-s':''}.webp?v=2`;
const box=document.getElementById('works');
WORKS.forEach((w,k)=>{
  const el=document.createElement('section');el.className='work';
  let thumbs='';
  for(let i=1;i<=w.n;i++)thumbs+=`<button data-w="${k}" data-i="${i}" aria-label="第 ${i} 页"><img src="${src(w,i,1)}" loading="lazy" decoding="async" alt="${w.title} 第 ${i} 页"></button>`;
  el.innerHTML=`<div class="head"><div><div class="num">${pad(k+1)}</div><h2>${w.title}</h2><div class="sub">${w.sub}</div></div><div class="meta">共 ${w.n} 页</div></div>
  <button class="cover" data-w="${k}" data-i="${w.cover}" aria-label="全屏查看 ${w.title}"><img src="${src(w,w.cover)}" ${k?'loading="lazy"':''} decoding="async" alt="${w.title} 封面"><span class="hint">全屏翻看 ${w.n} 页 →</span></button>
  <div class="strip">${thumbs}</div>`;
  box.appendChild(el);
});
const V=document.getElementById('viewer'),img=document.getElementById('vimg'),cnt=document.getElementById('vcount'),ttl=document.getElementById('vtitle');
let cw=0,ci=1;
function show(){const w=WORKS[cw];img.src=src(w,ci);img.alt=`${w.title} 第 ${ci} 页`;ttl.textContent=w.title;cnt.textContent=`${ci} / ${w.n}`;
  [ci-1,ci+1].forEach(j=>{if(j>=1&&j<=w.n){const p=new Image();p.src=src(w,j);}});}
function open(k,i){cw=k;ci=i;show();V.classList.add('on');document.body.style.overflow='hidden';}
function close(){V.classList.remove('on');document.body.style.overflow='';}
function go(d){const w=WORKS[cw];ci+=d;
  if(ci>w.n){if(cw<WORKS.length-1){cw++;ci=1;}else ci=w.n;}
  if(ci<1){if(cw>0){cw--;ci=WORKS[cw].n;}else ci=1;}
  show();}
box.addEventListener('click',e=>{const b=e.target.closest('[data-w]');if(b)open(+b.dataset.w,+b.dataset.i);});
document.getElementById('vclose').onclick=close;
document.getElementById('vprev').onclick=()=>go(-1);
document.getElementById('vnext').onclick=()=>go(1);
document.getElementById('stage').addEventListener('click',e=>{if(e.target.id==='stage')close();});
img.addEventListener('click',e=>{const r=img.getBoundingClientRect();go(e.clientX<r.left+r.width/3?-1:1);});
addEventListener('keydown',e=>{if(!V.classList.contains('on'))return;
  if(e.key==='Escape')close();else if(e.key==='ArrowRight'||e.key===' ')go(1);else if(e.key==='ArrowLeft')go(-1);});
let sx=null,sy=0;
V.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
V.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))go(dx<0?1:-1);sx=null;});
</script>
</body>
</html>
